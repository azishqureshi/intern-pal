name: Notify Canada Internships

on:
  schedule:
    # Runs every hour
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force_send_cibc:
        description: "Send all CIBC postings (ignore state)"
        required: false
        default: "false"

permissions:
  contents: write  # allow the workflow to push commits using GITHUB_TOKEN

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (enable push)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Ensure state.json exists
        run: |
          if [ ! -f state.json ]; then
            echo "{}" > state.json
            git add state.json
            git commit -m "chore(state): add initial state.json [skip ci]" || echo "no initial commit needed"
          else
            echo "state.json exists"
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run Canada Internship Notifier
        env:
          DISCORD_WEBHOOK_GENERAL: ${{ secrets.DISCORD_WEBHOOK_GENERAL }}
          DISCORD_WEBHOOK_AMD: ${{ secrets.DISCORD_WEBHOOK_AMD }}
          DISCORD_WEBHOOK_CIBC: ${{ secrets.DISCORD_WEBHOOK_CIBC }}
          MAX_AGE_DAYS_GENERAL: "0"
          FORCE_SEND_CIBC: ${{ github.event.inputs.force_send_cibc }}
        run: |
          python notify_canada_interns.py

      - name: Commit & push state.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          # only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to state.json — nothing to commit"
          else
            git commit -m "chore(state): update state.json [skip ci]"
            # push back to the branch this workflow is running on
            BRANCH="${GITHUB_REF#refs/heads/}"
            git push origin "HEAD:${BRANCH}"
            echo "pushed updated state.json to ${BRANCH}"
          fi