name: Notify Canada Internships

on:
  schedule:
    # Runs every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch: # manual trigger possible

permissions:
  contents: write  # allow the workflow to push commits using GITHUB_TOKEN

concurrency:
  group: internship-notifications
  cancel-in-progress: false

jobs:
  notify:
    if: github.ref_name == github.event.repository.default_branch
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (enable push)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Run Canada Internship Notifier
        env:
          DISCORD_WEBHOOK_GENERAL: ${{ secrets.DISCORD_WEBHOOK_GENERAL }}
          MAX_AGE_DAYS_GENERAL: "0"
        run: |
          python notify_canada_interns.py

      - name: Commit & push state.json (if changed)
        if: always()
        run: |
          test -f state.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          # only commit if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to state.json — nothing to commit"
          else
            git commit -m "chore(state): update state.json [skip ci]"
            # push back to the branch this workflow is running on
            BRANCH="${GITHUB_REF#refs/heads/}"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${BRANCH}"; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              git pull --rebase origin "$BRANCH"
            done
            echo "pushed updated state.json to ${BRANCH}"
          fi
      - name: Preserve recovery copy of notification history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notification-state-${{ github.run_id }}
          path: state.json
          retention-days: 7
